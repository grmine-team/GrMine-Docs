<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // This script takes the current url and converts the path and query
      // string into just a query string, and then redirects the browser
      // to the new url with only a hash and the path+query.
      // This allows SPA client-side routing to work on GitHub Pages.
      (function(l) {
        if (l.search) {
          var q = {};
          l.search.slice(1).split('&').forEach(function(v) {
            var a = v.split('=');
            q[a[0]] = a.slice(1).join('=');
          });
          if (q.p !== undefined) {
            window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + (q.p || '') +
              (l.search ? ('&' + l.search.slice(1)) : '') +
              l.hash
            );
          }
        }
      }(window.location))
    </script>
  </head>
  <body>
    <script type="text/javascript">
      // This script needs to be inline since it's used on a 404 page.
      // Segment pathname to get the relative path prefix (e.g., "" or "/base")
      var pathSegments = location.pathname.split('/');
      // Remove empty first segment and last segment (this 404.html file's "directory")
      var segments = pathSegments.filter(Boolean);
      segments.pop(); // remove '404' from end

      // Calculate how many levels deep we are
      var depth = segments.length;
      var prefix = '';
      for (var i = 0; i < depth; i++) {
        prefix += '../';
      }

      // Redirect to index.html while preserving the path via session storage
      sessionStorage.redirect = location.pathname;
      location.replace(prefix + 'index.html');
    </script>
  </body>
</html>
